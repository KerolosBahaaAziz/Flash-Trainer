name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Without an explicit shell, GitHub runs steps with `bash -e` and no pipefail,
# so `cmd | tee log` would report tee's exit code and hide a failed cmd.
# `shell: bash` makes GitHub use `bash -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # keep in sync with local toolchain
          cache: true

      # Like `npm ci`: install exactly what pubspec.lock says, fail if it's out of date.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # Errors and warnings fail the build; infos are reported but not fatal (yet).
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  build-android:
    name: Android debug build (no warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Gradle 9 / AGP 9 need JDK 17+. 21 matches the local setup.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image ships an Android SDK with current cmdline-tools, so we use
      # its sdkmanager directly. (android-actions/setup-android@v3 failed here: it
      # installs the removed "tools" package by default and downgrades cmdline-tools.)
      #
      # permission_handler_android compiles against API 37, which the SDK
      # registers as "android-37.0". AGP 9 resolves that name natively, so no
      # symlink is needed here (or anywhere else).
      - name: Install Android SDK Platform 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` is killed by SIGPIPE when sdkmanager exits; `|| true` keeps
          # that from failing the step under pipefail.
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # keep in sync with local toolchain
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug 2>&1 | tee build.log

      # "Builds cleanly" = no warning lines in Flutter's build output. That covers
      # Flutter's toolchain checks (Gradle/AGP/Kotlin versions, compileSdk, plugins
      # applying KGP) and AGP warnings it surfaces. Gradle/Kotlin *deprecation*
      # notices are not printed by `flutter build` without --verbose, so they don't
      # fail this check; they're tracked separately.
      - name: Fail on build warnings
        run: |
          if grep -nE '^(Warning|WARNING)\b' build.log; then
            echo "::error::flutter build apk printed the warnings above. Fix them or explain why in the PR."
            exit 1
          fi
          echo "No build warnings."
